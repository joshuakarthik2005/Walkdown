</style><title id="t">Replan stability: jobs moved after a crew outage</title><desc id="d">CP-SAT moves fewer jobs than re-running the baseline, but more than the patch heuristic, in exchange for lower risk.</desc><rect class="bg" width="720" height="308" rx="8"/><text class="h" x="20" y="28">Replan stability: jobs moved after a crew outage</text><text class="m" x="20" y="48">Median jobs moved when the busiest crew is out for 72 h · fewer = more stable · 5 seeds per regime</text><rect class="s1" x="20" y="57" width="10" height="10" rx="2"/><text class="m" x="35" y="66">CP-SAT two-stage</text><rect class="s2" x="154" y="57" width="10" height="10" rx="2"/><text class="m" x="169" y="66">Baseline re-run</text><rect class="s3" x="281" y="57" width="10" height="10" rx="2"/><text class="m" x="296" y="66">Baseline patch</text><text class="t" x="138" y="103.0" text-anchor="end">loose</text><path class="s1" d="M150,78 h72.92307692307692 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-72.92307692307692 z"/><text class="m" x="232.9230769230769" y="88">2</text><path class="s2" d="M150,92 h111.38461538461539 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-111.38461538461539 z"/><text class="m" x="271.38461538461536" y="102">3</text><path class="s3" d="M150,106 h111.38461538461539 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-111.38461538461539 z"/><text class="m" x="271.38461538461536" y="116">3</text><text class="t" x="138" y="159.0" text-anchor="end">tight capacity</text><path class="s1" d="M150,134 h265.2307692307692 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-265.2307692307692 z"/><text class="m" x="425.2307692307692" y="144">7</text><path class="s2" d="M150,148 h496.0 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-496.0 z"/><text class="m" x="656.0" y="158">13</text><path class="s3" d="M150,162 h149.84615384615384 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-149.84615384615384 z"/><text class="m" x="309.8461538461538" y="172">4</text><text class="t" x="138" y="215.0" text-anchor="end">tight shutdown</text><path class="s1" d="M150,190 h